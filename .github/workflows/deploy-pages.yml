name: Deploy Learning Hub
on:
  push: {branches: [main]}
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python -m compileall -q labs && python scripts/validate_notebooks.py
      - uses: actions/configure-pages@v5
      - run: |
          rm -rf site; mkdir -p site
          cp -R hub/. site/; mkdir -p site/quiz site/assets
          cp -R quiz/. site/quiz/; cp -R assets/. site/assets/
          cp -R docs site/docs; cp -R labs site/labs
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: ${{ steps.deployment.outputs.page_url }}}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
