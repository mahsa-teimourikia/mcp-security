[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-engineering"
version = "0.1.0"
description = "Notebook-first MCP and agent-protocol security engineering course"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
mcp = [
  "a2a-sdk>=1.3.0,<2",
  "mcp>=2.3,<2.4",
  "networkx>=3.5,<4",
  "opentelemetry-sdk>=1.45.2,<2",
  "PyJWT[crypto]>=2.15.1,<3",
]
notebooks = [
  "ipykernel>=7.4,<8",
  "jupyter>=1,<2",
  "jupyterlab>=4.6.5,<5",
  "nbclient>=0.11,<1",
  "nbformat>=5.11.1,<6",
  "notebook>=7.6.4,<8",
]
contributor = [
  "mcp-security-engineering[mcp,notebooks]",
  "hypothesis>=6.170,<7",
  "pytest>=9.2,<10",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
required-version = ">=0.13.6,<0.14"
