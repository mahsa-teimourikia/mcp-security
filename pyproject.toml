[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-engineering"
version = "0.1.0"
description = "Notebook-first MCP and agent-protocol security engineering course"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp>=2.2,<2.3",
  "PyJWT[crypto]>=2.15,<3",
]
notebooks = [
  "ipykernel>=6,<7",
  "jupyter>=1,<2",
  "jupyterlab>=4.6.4,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "notebook>=7.6.3,<8",
]
contributor = [
  "mcp-security-engineering[mcp,notebooks]",
  "hypothesis>=6.168,<7",
  "pytest>=9.0.3,<10",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
