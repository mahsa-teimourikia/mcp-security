[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-engineering"
version = "0.1.0"
description = "Notebook-first MCP and agent-protocol security engineering course"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
notebooks = [
  "ipykernel>=6,<7",
  "jupyter>=1,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]
contributor = [
  "mcp-security-engineering[mcp,notebooks]",
  "pytest>=8,<9",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
