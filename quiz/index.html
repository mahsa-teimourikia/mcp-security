<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP Security Knowledge Check</title><style>body{font:16px/1.6 system-ui;max-width:900px;margin:auto;padding:2rem 1rem;background:#f8fafb;color:#102537}header{border-bottom:1px solid #ddd}header img,footer img{width:42px;height:42px;object-fit:contain}.q{background:#fff;border:1px solid #d9e3e1;border-radius:12px;padding:1rem;margin:1rem 0}.q label{display:block;border:1px solid #ddd;padding:.45rem;margin:.3rem 0;border-radius:8px}button{background:#102537;color:#fff;border:0;border-radius:8px;padding:.7rem 1rem;cursor:pointer}.result{color:#b95a20;font-weight:700}a{color:#b95a20}</style></head><body><header><a href="../"><img src="../assets/one-plus-i.png" alt="One+i"></a><h1>MCP supply-chain security knowledge check</h1><p>Answer, grade, and review explanations.</p></header><main id="quiz"></main><button id="grade">Grade my answers</button> <button onclick="location.reload()">Reset</button><p id="result" class="result"></p><footer><img src="../assets/one-plus-i-light.png" alt="One+i"> Learning with One+i · <a href="https://oneplusi.io">oneplusi.io</a></footer><script src="questions.js"></script><script>const quizEl=document.getElementById('quiz'),gradeBtn=document.getElementById('grade'),resultEl=document.getElementById('result');quizEl.innerHTML=QUESTIONS.map((q,i)=>`<section class="q"><strong>${i+1}. [${q.level}] ${q.text}</strong>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<p id="e${i}"></p></section>`).join('');gradeBtn.onclick=()=>{let s=0;QUESTIONS.forEach((q,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`);let e=document.querySelector('#e'+i);if(v&&+v.value===q.answer){s++;e.textContent='Correct — '+q.explanation}else e.textContent='Review — '+q.explanation});resultEl.textContent=`Score: ${s}/${QUESTIONS.length} (${Math.round(s/QUESTIONS.length*100)}%).`}</script></body></html>
